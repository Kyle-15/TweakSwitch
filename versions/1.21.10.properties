# Minecraft 1.21.10: the versions TweakSwitch is built and tested against
minecraft_version=1.21.10
fabric_api_version=0.138.4+1.21.10
modmenu_version=16.0.1
# What fabric.mod.json accepts: one jar covers 1.21.9 and 1.21.10
minecraft_range=>=1.21.9 <1.21.11
# Which src/compat/<dir> holds the version-specific calls
compat=1.21.10
# Java the game runs on
java_version=21
# Which src/render/<dir> holds the drawing layer
render=1.21.10
# Mojang's names still call Identifier "ResourceLocation" here; the build compiles a renamed copy (see build.gradle)
identifier_name=old
