plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Which Minecraft version to build for: ./gradlew build -Pmc=26.2 (default: the newest). Each version's dependency
// versions live in versions/<mc>.properties, and the few calls whose names differ between versions in src/compat/<dir>.
def mc = providers.gradleProperty("mc").getOrElse("26.3")
def versionFile = file("versions/${mc}.properties")
if (!versionFile.exists()) {
	throw new GradleException("No versions/${mc}.properties; supported: " + file("versions").list().collect { it - ".properties" }.sort().join(", "))
}
def versionProperties = new Properties()
versionFile.withInputStream { versionProperties.load(it) }
versionProperties.each { key, value -> ext.set(key, value) }
version = "${project.mod_version}+${mc}"

fabricApi {
	// Screenshot tests: ./gradlew runClientGameTest
	configureTests {
		createSourceSet = true
		modId = "tweakswitch-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// WebP decoding for Modrinth images (Java can't read WebP on its own), bundled inside the mod jar
	for (String lib : [
		"com.twelvemonkeys.imageio:imageio-webp",
		"com.twelvemonkeys.imageio:imageio-core",
		"com.twelvemonkeys.imageio:imageio-metadata",
		"com.twelvemonkeys.common:common-lang",
		"com.twelvemonkeys.common:common-io",
		"com.twelvemonkeys.common:common-image",
	]) {
		implementation "${lib}:${project.twelvemonkeys_version}"
		include "${lib}:${project.twelvemonkeys_version}"
	}

	// Optional: adds a config button in Mod Menu's mod list
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	gametestCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

sourceSets.main.java.srcDir("src/compat/${project.compat}/java")

processResources {
	def version = project.version
	def minecraftRange = project.minecraft_range
	inputs.property "version", version
	inputs.property "minecraftRange", minecraftRange

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft": minecraftRange
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
